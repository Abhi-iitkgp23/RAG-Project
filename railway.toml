[build]
builder = "NIXPACKS"
buildCommand = "cd node_modules/better-sqlite3 && npx --yes node-gyp rebuild && cp build/Release/better_sqlite3.node prebuilds/linux-$(node -p process.arch).node && cd ../.. && npm run build"

[deploy]
startCommand = "sh scripts/release.sh"
restartPolicyType = "ON_FAILURE"
